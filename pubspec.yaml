name: flutter_face_liveness_detection
description: On-device face liveness detection for Flutter with randomized active challenges and multi-signal passive anti-spoofing.
version: 0.1.0
homepage: https://github.com/akhileshgoswami/flutter_face_liveness_detection
repository: https://github.com/akhileshgoswami/flutter_face_liveness_detection
issue_tracker: https://github.com/akhileshgoswami/flutter_face_liveness_detection/issues
topics:
  - liveness-detection
  - face-detection
  - anti-spoofing
  - camera
  - biometrics
screenshots:
  - description: 'Liveness check entry screen with configurable challenges'
    path: screenshots/01_home.png
  - description: 'Active challenge in progress — face tracked live in camera'
    path: screenshots/02_challenge.jpeg
  - description: 'Live face confirmed with passive anti-spoof signal scores'
    path: screenshots/03_result.jpeg
  - description: 'Full result card — brightness, sharpness, glare, texture, motion signals'
    path: screenshots/04_result_full.jpeg

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.14.0
  image: ^4.2.0
  sensors_plus: ^6.0.0
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
